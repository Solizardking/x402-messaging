name: Feature request
description: Propose a change to the protocol, clients or docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to do?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: "Note any wire-format, auth-scope or authority changes. Messages must never carry spending authority."}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
